<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Periódico">
<meta name="description" content="Mi Periódico de Inversiones — Noticias y patrones personalizados">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Periódico de Inversiones</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- React via CDN -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root {
    --bg-base:      #0a0a0f;
    --bg-surface:   #111118;
    --bg-card:      #16161f;
    --bg-hover:     #1c1c28;
    --border:       #2a2a3a;
    --border-light: #333345;
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-muted:   #555568;
    --accent-gold:  #c9a84c;
    --accent-gold-dim:#7a5f28;
    --accent-green: #3ddc84;
    --accent-green-dim:#1a4a32;
    --accent-red:   #ff5c5c;
    --accent-red-dim:#4a1a1a;
    --accent-blue:  #5b9cf6;
    --accent-blue-dim:#1a2a4a;
    --accent-purple:#9b72f5;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-mono:    'IBM Plex Mono', monospace;
    --font-body:    'IBM Plex Sans', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body, #root {
    height: 100%;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ── Layout shell ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ── */
  .header {
    padding: 16px 20px 0;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg-base) 70%, transparent);
    position: relative;
    z-index: 10;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .masthead {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
    line-height: 1.1;
  }

  .masthead span {
    color: var(--accent-gold);
  }

  .date-stamp {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.6;
  }

  .sync-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--accent-gold);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 12px;
    width: 100%;
    justify-content: center;
  }

  .sync-btn:active { transform: scale(0.98); background: var(--bg-hover); }
  .sync-btn.syncing { color: var(--text-muted); }
  .sync-btn.synced { color: var(--accent-green); border-color: var(--accent-green-dim); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    padding: 12px 20px 0;
    gap: 0;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    flex: 1;
    padding: 8px 0 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.3px;
  }

  .tab-btn.active {
    color: var(--text-primary);
  }

  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--accent-gold);
    border-radius: 1px;
  }

  .tab-count {
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 10px;
    margin-left: 5px;
    color: var(--text-muted);
  }

  .tab-btn.active .tab-count {
    border-color: var(--accent-gold-dim);
    color: var(--accent-gold);
  }

  /* ── Scroll body ── */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 20px;
    scroll-behavior: smooth;
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .filter-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-chip.active {
    background: var(--accent-gold-dim);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }

  .filter-chip:active { transform: scale(0.96); }

  /* ── Source section ── */
  .source-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .source-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .source-label.tikr { color: var(--accent-blue); }
  .source-label.sa { color: var(--accent-purple); }

  /* ── News card ── */
  .news-section { margin-bottom: 24px; }

  .news-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .news-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
  }

  .news-card.tikr::before { background: var(--accent-blue); }
  .news-card.sa::before { background: var(--accent-purple); }
  .news-card.expanded { border-color: var(--border-light); }
  .news-card:active { background: var(--bg-hover); }

  .news-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }

  .news-ticker {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-gold);
    background: var(--accent-gold-dim);
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .news-date {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .news-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .news-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-summary.expanded {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
  }

  .news-relevance {
    display: flex;
    gap: 3px;
    margin-top: 8px;
  }

  .relevance-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
  }

  .relevance-dot.filled { background: var(--accent-gold); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-title {
    font-family: var(--font-display);
    font-size: 17px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 13px;
    line-height: 1.6;
    max-width: 280px;
    margin: 0 auto 20px;
  }

  .empty-note {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: left;
    line-height: 1.8;
    max-width: 300px;
    margin: 0 auto;
  }

  /* ── Patterns section ── */
  .section-title {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .section-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .pattern-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: all 0.15s;
  }

  .pattern-card:active { background: var(--bg-hover); }

  .pattern-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .pattern-tipo {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
  }

  .tipo-narrativa { background: rgba(91,156,246,0.15); color: var(--accent-blue); border: 1px solid rgba(91,156,246,0.3); }
  .tipo-realidad  { background: rgba(61,220,132,0.15); color: var(--accent-green); border: 1px solid rgba(61,220,132,0.3); }
  .tipo-tendencia { background: rgba(201,168,76,0.15);  color: var(--accent-gold); border: 1px solid rgba(201,168,76,0.3); }

  .pattern-confianza {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .conf-alta  { color: var(--accent-green); }
  .conf-media { color: var(--accent-gold); }
  .conf-baja  { color: var(--text-muted); }

  .pattern-empresa {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .pattern-ticker-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent-gold);
    background: var(--accent-gold-dim);
    padding: 1px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 6px;
  }

  .pattern-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .pattern-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .pattern-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .tendencia-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tend-alcista  { background: var(--accent-green-dim); color: var(--accent-green); }
  .tend-bajista  { background: var(--accent-red-dim);   color: var(--accent-red); }
  .tend-neutral  { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border); }

  .pattern-freq {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ── Charts ── */
  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .chart-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* ── Stats row ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ── File input hidden ── */
  input[type="file"] { display: none; }

  /* ── Status bar ── */
  .status-bar {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    padding: 8px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-base);
    letter-spacing: 0.3px;
  }


  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .news-card, .pattern-card { animation: fadeIn 0.2s ease both; }

  /* ── Scrollbar ── */
  .content::-webkit-scrollbar { width: 3px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  .info-banner {
    background: rgba(201,168,76,0.08);
    border: 1px solid var(--accent-gold-dim);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .info-banner strong { color: var(--accent-gold); font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/javascript" src="app.js"></script>

</body>
</html>
